{% if messages %}
<div id="messages-container" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:9999;max-width:480px;width:90%;">
  {% for message in messages %}
    <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show text-center shadow-lg" role="alert">
      {{ message }}
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>
  {% endfor %}
</div>
{% endif %}
